[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
description = "Jarvis — event-thinking-action система"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "jsonschema>=4.20",
    "faster-whisper>=1.2",
    "numpy>=2.5",
    "onnxruntime>=1.29",
    "nvidia-cublas-cu12>=12.9",
    "nvidia-cudnn-cu12>=9.24",
]

[project.scripts]
jarvis = "jarvis.bootstrap:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.dynamic]
version = { attr = "jarvis.__version__" }
