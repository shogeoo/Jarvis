[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
description = "Jarvis — event-thinking-action система"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
speech = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "onnxruntime>=1.20",
]
cuda = [
    "faster-whisper>=1.1",
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[project.scripts]
jarvis = "jarvis.bootstrap:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.dynamic]
version = { attr = "jarvis.__version__" }
