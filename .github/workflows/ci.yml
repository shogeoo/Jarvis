name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      - run: ruff check jarvis tests
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m build
      - name: Verify installed wheel resources and basic tools
        run: |
          python -m venv /tmp/jarvis-wheel
          /tmp/jarvis-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/jarvis-wheel/bin/python -c 'from jarvis.core.prompts import read_master_prompt; from jarvis.core.registry import ActionRegistry, EventRegistry; from jarvis.core.runtime import register_core_protocol; assert "action_definition" in read_master_prompt(); a = ActionRegistry(); register_core_protocol(a, EventRegistry()); assert a.get("execute_command")'
          /tmp/jarvis-wheel/bin/jarvis --help
      - run: python tests/wheel_smoke.py /tmp/jarvis-wheel/bin/python
